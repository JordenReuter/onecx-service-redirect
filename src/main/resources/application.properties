# Rule group: auftragnehmerportal-mui
# Rules are evaluated in index order (0, 1, 2, ...) by the browser against the full URL including fragment.
# Most specific patterns (those requiring a fragment) must come first.
%dev.onecx.redirect.url-rewrite-rules.".*/auftragnehmerportal-mui.*"."0".pattern=auftragnehmerportal-mui\\\\?a-cid=(?<acid>.+)#/task/(?<woId>.+)
%dev.onecx.redirect.url-rewrite-rules.".*/auftragnehmerportal-mui.*"."0".replace-pattern=/ui/giga-mobile/mobile-workorder-mgt-page/workorder/($woId)?a-cid=($acid)

%dev.onecx.redirect.url-rewrite-rules.".*/auftragnehmerportal-mui.*"."1".pattern=auftragnehmerportal-mui\\\\?a-cid=(?<acid>.+)#/testOrder/(?<orderId>.+)
%dev.onecx.redirect.url-rewrite-rules.".*/auftragnehmerportal-mui.*"."1".replace-pattern=/ui/giga-mobile/mobile-testorder-mgt-page/testorder/($orderId)?a-cid=($acid)

%dev.onecx.redirect.url-rewrite-rules.".*/auftragnehmerportal-mui.*"."2".pattern=auftragnehmerportal-mui\\\\?a-cid=(?<acid>.+)
%dev.onecx.redirect.url-rewrite-rules.".*/auftragnehmerportal-mui.*"."2".replace-pattern=/ui/giga-mobile/mobile-workorder-mgt-page?a-cid=($acid)


# INTEGRATION TEST
quarkus.test.integration-test-profile=test
